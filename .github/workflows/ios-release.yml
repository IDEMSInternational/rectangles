# Builds the iOS app and uploads it to TestFlight. Start it by hand from the
# Actions tab, after `npm version` and `git push --follow-tags` (see the README).
#
# Signing works as in open-app-builder's iOS release (open-app-builder-actions):
# fastlane match, with the certificate and profiles kept encrypted in a Google
# Cloud Storage bucket. Nothing here or in ios/App/fastlane/Fastfile is specific to
# Rectangles: the Fastfile reads the app ID from the Xcode project.
name: iOS - Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        default: testflight
        type: choice
        options:
          - testflight
      allow_provisioning_changes:
        description: 'Let fastlane match create or renew the provisioning profile (needed on the first run)'
        required: true
        default: false
        type: boolean

# Starting a release on a branch cancels one already running there
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Build iOS and release to ${{ inputs.target }}
    # App Store Connect requires the iOS 26 SDK (Xcode 26), the default on macos-26.
    # Keep in step with open-app-builder-actions when Apple raises the requirement.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Fails in seconds if one is missing, rather than after the build.
      # Only this step and the fastlane one get the secrets, so npm packages'
      # install scripts and the web build never see them.
      - name: Check secrets and variables are set
        env: &signing-env
          APP_STORE_TEAM_ID: ${{ vars.APP_STORE_TEAM_ID }}
          GCP_IOS_CERTS_PROJECT_ID: ${{ vars.GCP_IOS_CERTS_PROJECT_ID }}
          GCP_IOS_CERTS_BUCKET_ID: ${{ vars.GCP_IOS_CERTS_BUCKET_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GCP_IOS_CERTS_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_IOS_CERTS_SERVICE_ACCOUNT_KEY }}
          GCP_IOS_CERTS_ENCRYPTION_PASSWORD: ${{ secrets.GCP_IOS_CERTS_ENCRYPTION_PASSWORD }}
          ALLOW_PROVISIONING_CHANGES: ${{ inputs.allow_provisioning_changes }}
        run: |
          missing=0
          for var in APP_STORE_TEAM_ID GCP_IOS_CERTS_PROJECT_ID GCP_IOS_CERTS_BUCKET_ID \
                     APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY \
                     GCP_IOS_CERTS_SERVICE_ACCOUNT_KEY GCP_IOS_CERTS_ENCRYPTION_PASSWORD; do
            if [ -z "$(printenv "$var")" ]; then
              echo "❌ $var is not set"
              missing=1
            else
              echo "✅ $var is set"
            fi
          done
          exit $missing

      # Pin the major Xcode version so a runner image update can't silently change it
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - uses: actions/checkout@v7
        with:
          submodules: true # games-common-core
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build web app and sync iOS project
        run: |
          npx ng build
          npx cap sync ios

      # npm version already did this; again in case package.json was edited by hand
      - name: Copy the version from package.json into the Xcode project
        run: node tools/ios-version.mjs

      # Installs the gems from ios/App/Gemfile.lock and caches them
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ios/App

      - name: Build and release to ${{ inputs.target }}
        working-directory: ios/App
        env: *signing-env
        run: bundle exec fastlane "release_${{ inputs.target }}"

      - name: Upload Xcode build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-logs
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
