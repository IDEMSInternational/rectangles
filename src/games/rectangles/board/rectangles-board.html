@let s = state();

<svg
  class="board-svg"
  #svg
  role="img"
  [attr.aria-label]="'Rectangles puzzle, ' + s.w + ' by ' + s.h"
  [attr.viewBox]="viewBox()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="cancelDrag()"
  (contextmenu)="$event.preventDefault()"
>
  <rect class="board-paper" x="0" y="0" [attr.width]="s.w" [attr.height]="s.h" rx="0.2" />

  @for (l of gridLines(); track $index) {
    <line class="board-grid" [attr.x1]="l.x1" [attr.y1]="l.y1" [attr.x2]="l.x2" [attr.y2]="l.y2" />
  }

  @for (t of tiles(); track $index) {
    <rect class="tile" [class.wrong]="t.wrong" [attr.x]="t.x" [attr.y]="t.y" [attr.width]="t.w" [attr.height]="t.h" rx="0.2" />
  }

  @if (hintView(); as h) {
    <rect
      class="board-hint"
      [attr.x]="h.tile.x"
      [attr.y]="h.tile.y"
      [attr.width]="h.tile.w"
      [attr.height]="h.tile.h"
      rx="0.2"
    />
  }

  @if (previewTile(); as p) {
    <rect
      class="board-hint preview"
      [class.blocked]="p.blocked"
      [attr.x]="p.x"
      [attr.y]="p.y"
      [attr.width]="p.w"
      [attr.height]="p.h"
      rx="0.2"
    />
  }

  @for (c of clues(); track $index) {
    <text class="clue" [attr.x]="c.x" [attr.y]="c.y">{{ c.value }}</text>
  }

  @if (hintView(); as h) {
    @if (!preview()) {
      <g boardFinger [at]="h.tap" [along]="h.along" />
    }
  }

  @if (noteLabel(); as label) {
    <g boardLabel class="note" role="status" [label]="label" />
  }

  @if (sizeLabel(); as label) {
    <g boardLabel [class.note]="label.blocked" aria-live="polite" [label]="label" />
  }
</svg>
