@if (tutorial(); as t) {
  <puzzle-tutorial [controls]="t" (skip)="endTutorial()">
    <rectangles-board [state]="t.state()" [hint]="t.hint()" (move)="t.move($event)" />
  </puzzle-tutorial>
} @else {
  <puzzle-shell [controls]="session" (help)="startTutorial()">
    <rectangles-board [state]="session.state()" [locked]="locked()" (move)="session.move($event)" />

    <puzzle-switch
      puzzleTools
      [(checked)]="locked"
      description="New rectangles can't be drawn over existing ones; tap a rectangle to remove it first"
    >
      Lock
    </puzzle-switch>
  </puzzle-shell>
}
